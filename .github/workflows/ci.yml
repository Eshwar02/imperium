name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        # Non-blocking for now — surfaces style issues without failing the build
        # while the existing lint debt is worked down. Tests are the hard gate.
        continue-on-error: true
        run: ruff check imperium

      - name: Test (pytest)
        # The suite degrades gracefully without live backing stores, so no
        # services are needed in CI.
        run: python -m pytest -q
